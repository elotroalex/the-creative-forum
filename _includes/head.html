<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <title>{% if page.layout == "home" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- CACHE-CONTROL -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- OpenGraph -->
  {% if page.layout == "home" %}
  <meta property="og:title" content="{{ site.title }}" />
  {% else %}
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}" />
  {% endif %}
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:image" content="{{ site.url }}/images/icons/open-graph.png" />

  <!-- Fonts and styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,600;0,800;1,400&display=swap" />
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}" />
  <meta name="theme-color" content="#1d1c21" />

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/icons/favicon-16x16.png" />
  <link rel="manifest" href="/images/icons/site.webmanifest" />
</head>
